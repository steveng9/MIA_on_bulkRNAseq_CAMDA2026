# The 200-most-variable-gene cohort (configs/datasets/BRCA_HVG200.yaml): every
# generator rebuilt on the same 200 genes so that DPSynth, which cannot fit all
# 978, is compared like for like.  Same splits and attack parameters as
# grid_sota_brca.yaml.
name: grid_hvg200_brca
dataset: BRCA_HVG200
notes: "200-gene subset: all attacks on every generator incl. DPSynth"
device: cuda

generators:
  - mvn
  - cvae
  - nd
  - pgg
  - dpcvae
  - "tabsyn@class_freq=train,diff_schedule=steps,latent_scale=std,preprocess=clip:0.001:0.999+standard"
  - tabpfn
  - "dpsynth@mechanism=star"
  - "dpsynth@bounds=data,mechanism=star"
  - dpsynth                        # MST
splits: [1, 2, 3, 4, 5]

attacks:
  mahalamia:
    class: mahalamia
    params:
      use_reference: true
  mamamia:
    class: mamamia
    params:
      n_bins: 4
  generic_mc:
    class: generic
    params: {method: mc}
  generic_gan_leaks:
    class: generic
    params: {method: gan_leaks}
  generic_conf_lr:
    class: generic
    params: {method: conf_lr}
  generic_conf_rf:
    class: generic
    params: {method: conf_rf}
  melomia_nd:
    class: melomia_nd
    params:
      n_shadows: 30
      n_noise: 600
      optuna_trials: 60
      classifiers: [xgb, rf, lgbm, cat, mlp]
  melomia_cvae:
    class: melomia_cvae
    params:
      n_shadows: 30
      n_noise: 50
      optuna_trials: 60
      classifiers: [xgb, rf, lgbm, cat, mlp]
