# DP-PGM structure x binning sweep (2026-09-23).  Driven by
# scripts/pgm_structure_sweep.py, NOT run_experiment.py.
#
# Question (Steven): is there a DP-valid DP-PGM configuration whose synthetic
# data, at eps=1000, is as good as CVAE/ND -- and does MahalaMIA then attack it
# as well as it attacks them?  eps=10 on the same configs shows the price.
#
# Two things made every earlier DP-safe target uninformative (FINDINGS 10h):
#   1. the dp_* edges were read off a noisy histogram with a biased estimator
#      (edge_estimator=clip): empty cells kept their positive noise, so even at
#      eps=1000 the per-gene bounds sat at ~2 / ~22 instead of ~9.5 / ~13.5,
#      and 4 bins put ~85% of every gene in one cell.  Fixed by
#      edge_estimator=threshold (smartnoise approx_bounds' rule);
#   2. n_2way=0 is a star around the label: genes independent given subtype,
#      so the release has no gene-gene covariance at all, which is the only
#      thing MahalaMIA reads.  Fixed by structure=tree / tree_label: MST's
#      recipe (exponential-mechanism spanning tree, McKenna et al. 2021) on top
#      of last year's star.
#
# Every config is DP end to end EXCEPT those marked `reference: non-DP`.
# Each target gets: fidelity (mia.fidelity.evaluate, same as the eps sweep and
# results/fidelity_grid.csv), every MahalaMIA variant below, shipped MAMA-MIA,
# and the nine MAMA-MIA aggregation arms (black-box aux edges).
name: pgm_structure_sweep
datasets: [BRCA, COMBINED]
epsilons: [1000, 10]
splits: [1, 2, 3]

# Shared by every config (the grid's DP-PGM target_params).
base: {joint_mode: true, n_1way: 978, n_2way: 0, pgm_iters: 1000}

binnings:
  # public grid, free: 48 bins over (0,24) = 0.5 log2 units, ~8 occupied/gene
  uniform48:        {binning: uniform, n_bins: 48}
  # DP per-gene bounds (10% of rho), equal width between them
  dp_uniform16:     {binning: dp_uniform, edge_estimator: threshold, n_bins: 16}
  # DP per-gene equal depth (10% of rho)
  dp_quantile8:     {binning: dp_quantile, edge_estimator: threshold, n_bins: 8}
  dp_quantile16:    {binning: dp_quantile, edge_estimator: threshold, n_bins: 16}
  dp_quantile32:    {binning: dp_quantile, edge_estimator: threshold, n_bins: 32}
  # reference: non-DP (private percentiles, unbudgeted)
  quantile16:       {binning: quantile, n_bins: 16}

structures:
  star:        {structure: hierarchical}            # last year's winner: 1-way + gene x label
  tree:        {structure: tree}                    # + DP spanning tree of (gene, gene)
  tree_label:  {structure: tree_label}              # + DP spanning tree of (gene, gene, label)

# Extra single configs: the edge fix alone at the old bin count.
extra:
  dp_quantile4_star: {binning: dp_quantile, edge_estimator: threshold, n_bins: 4, structure: hierarchical}

# MahalaMIA variants, named exactly as in mahala_geometry_*.yaml so the
# CVAE / ND / MVN comparison rows already exist (ledoit_cc is new; it is run on
# mvn/cvae/nd splits 1-3 by the same script with --references).
mahalamia:
  pinv:           {covariance: pinv}
  ledoit:         {covariance: ledoit_wolf}
  ridge1.0e-8:    {covariance: ridge, ridge_alpha: 1.0e-8}
  pca850:         {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 850}
  pca800:         {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 800}
  pinv_cc:        {covariance: pinv, class_conditional: true}
  ledoit_cc:      {covariance: ledoit_wolf, class_conditional: true}
  ridge1.0e-8_cc: {covariance: ridge, ridge_alpha: 1.0e-8, class_conditional: true}
  pca850_cc:      {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 850, class_conditional: true}
  pca800_cc:      {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 800, class_conditional: true}
