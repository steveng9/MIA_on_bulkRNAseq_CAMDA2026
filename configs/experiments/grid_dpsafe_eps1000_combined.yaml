# BROKEN_DP_EDGES: the dp_* targets here were built with the biased edge
# estimator (results/BROKEN.md); load_target now refuses them.  Kept only as
# a record.  Do not rerun; use edge_estimator=threshold variants instead.
# The DP-safe grid at eps=1000: does anything rise above chance once the noise
# is negligible?  The legacy `quantile` target rides along as a reference.
#
# The DP-PGM column, rebuilt on binnings that are inside the epsilon.
#
# The legacy `quantile` binning spends no budget on its edges, and FINDINGS
# section 10 measures the attack beating the epsilon bound because of it.  These
# three releases are DP end to end: `uniform` (equal width over the public
# range), `dp_uniform` (DP bounds, equal width -- smartnoise's BinTransformer)
# and `dp_quantile` (DP equal depth, 10% of rho).
name: grid_dpsafe_eps1000_combined
dataset: COMBINED
notes: "the DP-safe grid at eps=1000, plus the legacy binning as reference"
device: cuda

generators: ["pgm@binning=uniform,epsilon=1000", "pgm@binning=dp_quantile,epsilon=1000", "pgm@binning=dp_uniform,epsilon=1000", "pgm@epsilon=1000"]
splits: [1, 2, 3, 4, 5]

# Target hyperparameters that reproduce the challenge's released data.
target_params:
  mvn:
    noise_level: 0.7          # the abstract's MVN column
  pgm:
    epsilon: 10.0             # DP-PGM (eps = 10)
    n_bins: 4
    pgm_iters: 1000
    joint_mode: true

attacks:
  mahalamia:
    class: mahalamia
    params:
      use_reference: true     # COMBINED ships an auxiliary non-member set
  mamamia:
    class: mamamia
    params:
      n_bins: 4               # match DP-PGM's own discretisation
  melomia_nd:
    class: melomia_nd
    params:
      n_shadows: 20           # the abstract used 5; see TODO item 2
      n_noise: 600
      optuna_trials: 60
      classifiers: [xgb, rf, lgbm, cat, mlp]
  melomia_cvae:
    class: melomia_cvae
    params:
      n_shadows: 20
      n_noise: 50
      optuna_trials: 60
      classifiers: [xgb, rf, lgbm, cat, mlp]
