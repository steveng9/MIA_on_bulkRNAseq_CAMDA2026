# DP-PGM star with hairs, Steven's literal picture (2026-09-24): the hairs
# are DISJOINT gene pairs (max_component=2: a pair is a candidate only if both
# genes are still singletons), each pair hung on the label by its more
# label-dependent gene.  pgm_hairy_star.yaml lets Kruskal's components grow
# freely instead; with l=400 on COMBINED that gave 3 large trees, not pairs.
# l <= 489 (= 978 / 2).  Same settings as pgm_forest_sweep / pgm_hairy_star.
name: pgm_hairy_pairs
datasets: [BRCA, COMBINED]
epsilons: [10, 1000]
first_epsilon: 10
splits: [1]

base: {joint_mode: true, n_1way: 978, n_2way: 0, pgm_iters: 1000}

binnings:
  dp_quantile16: {binning: dp_quantile, edge_estimator: threshold, n_bins: 16}
  dp_quantile32: {binning: dp_quantile, edge_estimator: threshold, n_bins: 32}

structures:
  pairs_l20: {structure: hairy_star, max_component: 2, l_pairs: 20}
  pairs_l50: {structure: hairy_star, max_component: 2, l_pairs: 50}
  pairs_l100: {structure: hairy_star, max_component: 2, l_pairs: 100}
  pairs_l200: {structure: hairy_star, max_component: 2, l_pairs: 200}
  pairs_l489: {structure: hairy_star, max_component: 2, l_pairs: 489}
  pairs_l20_1way: {structure: hairy_star, max_component: 2, l_pairs: 20, with_1way: true}
  pairs_l50_1way: {structure: hairy_star, max_component: 2, l_pairs: 50, with_1way: true}
  pairs_l100_1way: {structure: hairy_star, max_component: 2, l_pairs: 100, with_1way: true}
  pairs_l200_1way: {structure: hairy_star, max_component: 2, l_pairs: 200, with_1way: true}
  pairs_l489_1way: {structure: hairy_star, max_component: 2, l_pairs: 489, with_1way: true}

mahalamia:
  pinv:           {covariance: pinv}
  ledoit:         {covariance: ledoit_wolf}
  ridge1.0e-8:    {covariance: ridge, ridge_alpha: 1.0e-8}
  pca850:         {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 850}
  pca800:         {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 800}
  pinv_cc:        {covariance: pinv, class_conditional: true}
  ledoit_cc:      {covariance: ledoit_wolf, class_conditional: true}
  ridge1.0e-8_cc: {covariance: ridge, ridge_alpha: 1.0e-8, class_conditional: true}
  pca850_cc:      {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 850, class_conditional: true}
  pca800_cc:      {covariance: ridge, ridge_alpha: 1.0e-6, n_components: 800, class_conditional: true}
